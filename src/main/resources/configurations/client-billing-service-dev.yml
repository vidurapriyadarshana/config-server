server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudops_billing
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

gcs:
  bucket-name: cloudops-invoices-dev
  project-id: cloudops-psa-dev

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
