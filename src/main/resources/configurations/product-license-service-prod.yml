server:
  port: 8083

spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/cloudops_products}

gcs:
  bucket-name: cloudops-product-assets
  project-id: ${GCP_PROJECT_ID}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
